<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Trắc Nghiệm</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #eef2f5; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="appFrame" allowfullscreen></iframe>

    <script>
        // Thay bằng link /exec của bạn (không chứa ?page=...)
        const scriptUrl = "https://script.google.com/macros/s/AKfycbyiErpaUH3eRhdUalXxwuQ4NNLEoy745iNaxFkujyPCC91OA73X1HrctpvOBEcwO9VWDg/exec";
        
        // Đọc tham số phía sau dấu ? trên trình duyệt
        const urlParams = new URLSearchParams(window.location.search);
        const pageParam = urlParams.get('page');
        
        // Nếu có tham số page, ghép vào link iframe. Nếu không, tải trang học sinh mặc định.
        const finalUrl = pageParam ? `${scriptUrl}?page=${pageParam}` : scriptUrl;
        
        document.getElementById('appFrame').src = finalUrl;
    </script>
</body>
</html>
